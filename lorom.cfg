# Linker configuration for SNES LoROM cartridge

MEMORY {
    # Zero Page
    ZP: start = $0000, size = $0100, type = rw, define = yes;
    
    # RAM
    RAM: start = $0100, size = $1F00, type = rw, define = yes;
    
    # ROM - LoROM mapping
    # Banks $80-$FF are mirrored to $00-$7F
    ROM0: start = $8000, size = $8000, file = %O, fill = yes, fillval = $00;
    ROM1: start = $018000, size = $8000, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS: load = RAM, type = bss, define = yes;
    DATA: load = ROM1, run = RAM, type = rw, define = yes;
    STARTUP: load = ROM0, type = ro;
    CODE: load = ROM0, type = ro;
    RODATA: load = ROM0, type = ro;
    VECTORS: load = ROM0, type = ro, start = $FFE0;
    SPCDATA: load = ROM1, type = ro, define = yes, align = $100;
}

FILES {
    %O: format = bin;
}
